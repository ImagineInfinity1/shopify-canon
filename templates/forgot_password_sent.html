<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset link - Listing Cannon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}?v=3" rel="stylesheet">
</head>
<body>
    <div class="auth-container d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="auth-card p-4">
                        <div class="text-center mb-4">
                            <h1 class="auth-brand mb-3" style="font-size: 1.5rem;">
                                <i class="fas fa-paper-plane me-2" style="color: #635bff;"></i>
                                Listing Cannon
                            </h1>
                            <p class="text-muted">Password reset link</p>
                        </div>
                        <p class="mb-3">Email is not configured on this server. Use the link below to reset your password. It is valid for 1 hour.</p>
                        <div class="mb-3">
                            <label class="form-label small">Copy this link:</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="resetLink" value="{{ reset_link }}" readonly style="font-size: 0.9rem; word-break: break-all;">
                                <button type="button" class="btn btn-outline-primary" onclick="navigator.clipboard.writeText(document.getElementById('resetLink').value); this.textContent='Copied!';">
                                    Copy
                                </button>
                            </div>
                        </div>
                        <p class="text-muted small">Or <a href="{{ reset_link }}">open the link</a> to set a new password.</p>
                        <div class="text-center mt-4">
                            <a href="{{ url_for('login') }}" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-1"></i>Back to login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
